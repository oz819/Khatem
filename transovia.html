<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transovia Logistics</title>
<meta name="theme-color" content="#05070c">
<meta name="description" content="Transovia Logistics: a road freight network across the Middle East.">
<style>
  :root {
    --gold: #ffc35a;
    --gold-hot: #ffe3a3;
    --amber: #ff9a1f;
    --ink: #05070c;
    /* stroke widths are multiplied by --k (set from JS) so lines stay thin at any size */
    --k: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    min-height: 420px;
    overflow: hidden;
    background: var(--ink);
  }

  /* The stage is ALWAYS exactly the image's aspect ratio (1672x941).
     JS sizes and positions it to "cover" the hero, so the image and the
     SVG overlay share one coordinate system: the image's own pixels. */
  .stage {
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    aspect-ratio: 1672 / 941;
  }
  .stage img,
  .stage svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .stage img { user-select: none; -webkit-user-drag: none; }
  .stage svg {
    overflow: visible;
    pointer-events: none;
    mix-blend-mode: screen;   /* the gold light adds to the photo, like real light */
  }

  /* --- routes --- */
  /* soft outer glow from two wide translucent strokes (no SVG filter, so it stays cheap) */
  .route-glow {
    fill: none;
    stroke: var(--amber);
    stroke-width: calc(var(--k) * 9px);
    stroke-linecap: round;
    opacity: .09;
  }
  .route-glow2 {
    fill: none;
    stroke: var(--gold);
    stroke-width: calc(var(--k) * 4px);
    stroke-linecap: round;
    opacity: .2;
  }
  .route-line {
    fill: none;
    stroke: url(#routeGrad);
    stroke-width: calc(var(--k) * 1.5px);
    stroke-linecap: round;
  }
  .route-sheen {
    fill: none;
    stroke: var(--gold-hot);
    stroke-width: calc(var(--k) * 1px);
    stroke-linecap: round;
    opacity: .9;
  }
  .streak {
    fill: none;
    stroke: var(--gold-hot);
    stroke-linecap: round;
  }

  /* --- nodes --- */
  .node { opacity: 0; transition: opacity 1.2s ease; }
  .node.on { opacity: 1; }
  .node-halo {
    fill: url(#nodeHalo);
    transform-box: fill-box;
    transform-origin: center;
    animation: twinkle 3.6s ease-in-out infinite;
    animation-delay: var(--d, 0s);
  }
  .node-core { fill: #fff3d1; }
  @keyframes twinkle {
    0%, 100% { transform: scale(.82); opacity: .7; }
    50%      { transform: scale(1.12); opacity: 1; }
  }

  .pulse-ring { fill: none; stroke: var(--gold); }
  .pulse-flash { fill: url(#flashGrad); }

  @media (prefers-reduced-motion: reduce) {
    .node-halo { animation: none; }
  }
</style>
</head>

    baghdad:   { lat: 33.3152, lon: 44.3661, px: [725, 199] },
    kuwait:    { lat: 29.3759, lon: 47.9774, px: [921, 252] },
    shiraz:    { lat: 29.5918, lon: 52.5837, px: [1153, 213] },
    dammam:    { lat: 26.4207, lon: 50.0888, px: [963, 312] },
    manama:    { lat: 26.2285, lon: 50.5860, px: [1006, 333] },
    doha:      { lat: 25.2854, lon: 51.5310, px: [1066, 391] },
    dubai:     { lat: 25.2048, lon: 55.2708, px: [1254, 361] },
    abudhabi:  { lat: 24.4539, lon: 54.3773, px: [1182, 455] },
    muscat:    { lat: 23.5880, lon: 58.3829, px: [1368, 429] },
    riyadh:    { lat: 24.7136, lon: 46.6753, px: [827, 361], hub: true },
    jeddah:    { lat: 21.4858, lon: 39.1925, px: [580, 455] },
    abha:      { lat: 18.2164, lon: 42.5053, px: [666, 579] },
    seiyun:    { lat: 15.9430, lon: 48.7873, px: [846, 569] },
    sanaa:     { lat: 15.3694, lon: 44.1910, px: [737, 652] },
    aden:      { lat: 12.7855, lon: 45.0187, px: [717, 706] },
  };

  /* Network. Order = the order routes appear in the opening sequence. */
  const ROUTES = [
    ['riyadh', 'dubai'],
    ['riyadh', 'jeddah'],
    ['riyadh', 'kuwait'],
    ['jeddah', 'cairo'],
    ['kuwait', 'baghdad'],
    ['riyadh', 'muscat'],
    ['baghdad', 'istanbul'],
    ['riyadh', 'sanaa'],
    ['amman', 'riyadh'],
    ['kuwait', 'shiraz'],
    ['beirut', 'istanbul'],
    ['abudhabi', 'muscat'],
    ['cairo', 'amman'],
    ['riyadh', 'doha'],
    ['gaziantep', 'baghdad'],
    ['jeddah', 'seiyun'],
    ['dubai', 'shiraz'],
    ['sanaa', 'abudhabi'],
    ['cairo', 'baghdad'],
    ['istanbul', 'gaziantep'],
    ['riyadh', 'baghdad'],
    ['kuwait', 'dubai'],
    ['jeddah', 'abudhabi'],
    ['gaziantep', 'kuwait'],
    ['dubai', 'muscat'],
    ['beirut', 'cairo'],
    ['riyadh', 'abudhabi'],
    ['abha', 'aden'],
    ['amman', 'baghdad'],
    ['doha', 'dubai'],
  ];

  /* ------------------------------------------------------------------
   * 2. Projection: lat/lon -> Web Mercator -> hero pixels.
   *    a) a least-squares quadratic fit over all control points (the
   *       overall scale, rotation and perspective of the artwork), then
   *    b) a Gaussian RBF correction that bends the fit so each control
   *       point lands exactly on its glow, fading out smoothly between them.
   * ------------------------------------------------------------------ */
  const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * 180 / Math.PI;
  const features = (lat, lon) => {
    const u = (lon - 45) / 10, v = (mercY(lat) - 28) / 10;   // normalised around the map centre
    return [1, u, v, u * u, u * v, v * v];
  };

  function solve(A, b) {                // Gaussian elimination with partial pivoting
    const n = b.length;
    const M = A.map((row, i) => [...row, b[i]]);
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = c + 1; r < n; r++) {
        const f = M[r][c] / M[c][c];
        for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
      }
    }
    const x = new Array(n).fill(0);
    for (let r = n - 1; r >= 0; r--) {
      let s = M[r][n];
      for (let k = r + 1; k < n; k++) s -= M[r][k] * x[k];
      x[r] = s / M[r][r];
    }
    return x;
  }

  function buildProjection(cities) {
    const ctrl = Object.values(cities).filter(c => c.px);
    // a) least squares: (FᵀF) c = Fᵀ t, for x and y
    const F = ctrl.map(c => features(c.lat, c.lon));
    const m = F[0].length;
    const FtF = Array.from({ length: m }, (_, i) => Array.from({ length: m }, (_, j) =>
      F.reduce((s, f) => s + f[i] * f[j], 0)));
    const Ftx = Array.from({ length: m }, (_, i) => F.reduce((s, f, k) => s + f[i] * ctrl[k].px[0], 0));
    const Fty = Array.from({ length: m }, (_, i) => F.reduce((s, f, k) => s + f[i] * ctrl[k].px[1], 0));
    const cx = solve(FtF, Ftx), cy = solve(FtF, Fty);
    const base = (lat, lon) => {
      const f = features(lat, lon);
      return [f.reduce((s, v, i) => s + v * cx[i], 0), f.reduce((s, v, i) => s + v * cy[i], 0)];
    };

    // b) RBF residual warp, exact at control points
    const SIGMA = 85;                   // px: how far one correction reaches
    const P = ctrl.map(c => base(c.lat, c.lon));
    const phi = (a, b) => Math.exp(-((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2) / (SIGMA * SIGMA));
    const K = P.map(a => P.map(b => phi(a, b)));
    for (let i = 0; i < K.length; i++) K[i][i] += 1e-6;
    const ax = solve(K, ctrl.map((c, i) => c.px[0] - P[i][0]));
    const ay = solve(K, ctrl.map((c, i) => c.px[1] - P[i][1]));

    const project = (lat, lon) => {
      const q = base(lat, lon);
      let dx = 0, dy = 0;
      for (let i = 0; i < P.length; i++) { const w = phi(q, P[i]); dx += ax[i] * w; dy += ay[i] * w; }
      return [q[0] + dx, q[1] + dy];
    };
    const rms = Math.sqrt(ctrl.reduce((s, c) => {
      const q = base(c.lat, c.lon); return s + (q[0] - c.px[0]) ** 2 + (q[1] - c.px[1]) ** 2;
    }, 0) / ctrl.length);
    return { project, base, rms };
  }

  const proj = buildProjection(CITIES);
  for (const c of Object.values(CITIES)) c.xy = proj.project(c.lat, c.lon);

  /* ------------------------------------------------------------------
   * 3. Geometry: quadratic Bézier arcs that rise like flight paths.
   * ------------------------------------------------------------------ */
  const HUB = CITIES.riyadh.xy;
  function arc(a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L = Math.hypot(dx, dy);
    let nx = -dy / L, ny = dx / L;                    // unit normal
    if (ny > 0) { nx = -nx; ny = -ny; }               // bend upward (screen up = -y)
    if (Math.abs(ny) < 0.3) {                         // near-vertical routes: bow away from the hub
      const mx = (a[0] + b[0]) / 2 - HUB[0];
      if (Math.sign(nx) !== Math.sign(mx || 1)) { nx = -nx; ny = -ny; }
    }
    const lift = Math.min(0.26 * L, 140);
    const c = [(a[0] + b[0]) / 2 + nx * lift, (a[1] + b[1]) / 2 + ny * lift];
    const d = `M${a[0].toFixed(1)} ${a[1].toFixed(1)} Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
    return { d, L };
  }

  /* ------------------------------------------------------------------
   * 4. Build the SVG.
   * ------------------------------------------------------------------ */
  const svg = document.getElementById('routes');
  const glowLayer = document.getElementById('glowLayer');
  const lineLayer = document.getElementById('lineLayer');
  const nodeLayer = document.getElementById('nodeLayer');
  const fxLayer   = document.getElementById('fxLayer');
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };

  // nodes: only cities used by the network
  const used = new Set(ROUTES.flat());
  const nodes = {};
  [...used].forEach((id, i) => {
    const c = CITIES[id];
    const g = el('g', { class: 'node', transform: `translate(${c.xy[0].toFixed(1)} ${c.xy[1].toFixed(1)})` }, nodeLayer);
    const r = c.hub ? 22 : 15;
    const halo = el('circle', { class: 'node-halo', r, cx: 0, cy: 0 }, g);
    halo.style.setProperty('--d', `${(i * 0.37) % 3.6}s`);
    el('circle', { class: 'node-core', r: c.hub ? 3.2 : 2.3 }, g);
    nodes[id] = g;
  });

  const routes = ROUTES.map(([from, to], i) => {
    const a = CITIES[from].xy, b = CITIES[to].xy;
    const { d } = arc(a, b);
    const glow  = el('path', { class: 'route-glow', d }, glowLayer);
    const glow2 = el('path', { class: 'route-glow2', d }, glowLayer);
    const line  = el('path', { class: 'route-line', d }, lineLayer);
    const len = line.getTotalLength();
    for (const p of [glow, glow2, line]) {
      p.style.strokeDasharray = `${len} ${len}`;
      p.style.strokeDashoffset = len;
    }
    return { i, from, to, a, b, d, len, glow, glow2, line, busy: false, next: 0 };
  });

  /* ------------------------------------------------------------------
   * 5. Animation engine (one requestAnimationFrame loop).
   * ------------------------------------------------------------------ */
  const ease = {
    inOut: t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2,
    out:   t => 1 - (1 - t) ** 3,
    sine:  t => -(Math.cos(Math.PI * t) - 1) / 2,
  };
  const tweens = new Set();
  let clock = 0;               // ms of *visible* time (pauses when hidden/offscreen)
  const tween = (delay, dur, update, done) => tweens.add({ t0: clock + delay, dur, update, done, started: false });

  // moving particle: bright head + fading comet tail, drawn along the path
  function particle(route, dur, opts = {}) {
    const g = el('g', {}, fxLayer);
    g.style.opacity = 0;                             // invisible until its start time
    const tailSegs = [0.18, 0.32, 0.55, 0.9];        // opacity per tail segment, back to front
    const TAIL = Math.min(95, route.len * 0.3);
    const segs = tailSegs.map((o, k) => el('path', {
      class: 'streak', d: route.d,
      'stroke-opacity': o,
      'stroke-width': (1 + k * 0.6).toFixed(2),
    }, g));
    const bloom = el('circle', { r: 34, fill: 'url(#flashGrad)', opacity: .85 }, g);
    const halo = el('circle', { r: 17, fill: 'url(#particleHalo)' }, g);
    const core = el('circle', { r: 3, fill: '#fffaf0' }, g);
    const segLen = TAIL / segs.length;

    tween(opts.delay || 0, dur, p => {
      const e = opts.ease ? opts.ease(p) : ease.inOut(p);
      const s = e * route.len;
      const pt = route.line.getPointAtLength(s);
      bloom.setAttribute('cx', pt.x); bloom.setAttribute('cy', pt.y);
      halo.setAttribute('cx', pt.x); halo.setAttribute('cy', pt.y);
      core.setAttribute('cx', pt.x); core.setAttribute('cy', pt.y);
      segs.forEach((seg, k) => {
        const end = s - (segs.length - 1 - k) * segLen;   // front of this segment
        const start = Math.max(0, end - segLen);
        const l = Math.max(0, end - start);
        seg.style.strokeDasharray = `${l} ${route.len + 10}`;
        seg.style.strokeDashoffset = -start;
      });
      // fade in at the origin, out at the destination
      const fade = Math.min(1, p / 0.08, (1 - p) / 0.06 + 0.25);
      g.style.opacity = fade;
    }, () => {
      g.remove();
      pulse(route.to);
      opts.onDone && opts.onDone();
    });
  }

  // golden pulse when a shipment arrives
  function pulse(id) {
    const [x, y] = CITIES[id].xy;
    const g = el('g', { transform: `translate(${x.toFixed(1)} ${y.toFixed(1)})` }, fxLayer);
    const flash = el('circle', { class: 'pulse-flash', r: 0 }, g);
    const ring  = el('circle', { class: 'pulse-ring', r: 3, 'stroke-width': 1.4 }, g);
    const ring2 = el('circle', { class: 'pulse-ring', r: 3, 'stroke-width': 0.8 }, g);
    tween(0, 1500, p => {
      const e = ease.out(p);
      flash.setAttribute('r', (4 + 22 * Math.sin(Math.min(1, p * 1.6) * Math.PI / 2)).toFixed(2));
      flash.style.opacity = (1 - p) ** 1.6;
      ring.setAttribute('r', (3 + 30 * e).toFixed(2));
      ring.style.opacity = 0.9 * (1 - p);
      const p2 = Math.max(0, (p - 0.18) / 0.82);
      ring2.setAttribute('r', (3 + 22 * ease.out(p2)).toFixed(2));
      ring2.style.opacity = p2 > 0 ? 0.6 * (1 - p2) : 0;
    }, () => g.remove());
    const n = nodes[id];
    if (n) {                                          // the node itself brightens briefly
      tween(0, 900, p => { n.style.filter = `brightness(${1 + 0.9 * Math.sin(p * Math.PI)})`; },
                    () => { n.style.filter = ''; });
    }
  }

  const drawDur = r => Math.max(1300, Math.min(2600, 700 + r.len * 2.6));

  // draws a route from origin to destination, with the particle riding the leading edge
  function drawRoute(route, delay) {
    const dur = drawDur(route);
    route.busy = true;
    nodes[route.from].classList.add('on');
    tween(delay, dur, p => {
      const off = route.len * (1 - ease.inOut(p));
      for (const p of [route.line, route.glow, route.glow2]) p.style.strokeDashoffset = off;
    }, () => {
      for (const p of [route.line, route.glow, route.glow2]) p.style.strokeDasharray = 'none';
    });
    particle(route, dur, {
      delay,
      onDone: () => {
        nodes[route.to].classList.add('on');
        route.busy = false;
        route.next = clock + 1500 + Math.random() * 4000;
      },
    });
  }

  /* --- timeline --- */
  const INTRO_START = 700, STAGGER = 360;
  let introDone = false;
  const MAX_LIVE = 8;          // after the intro, up to this many shipments move at once

  function startIntro() {
    nodes.riyadh.classList.add('on');
    routes.forEach((r, i) => drawRoute(r, INTRO_START + i * STAGGER));
    tween(INTRO_START + routes.length * STAGGER + 2600, 1, () => {}, () => { introDone = true; });
  }

  // once drawn, routes carry repeating shipments, several at once
  function scheduleTraffic() {
    if (!introDone) return;
    const live = routes.filter(r => r.busy).length;
    if (live >= MAX_LIVE) return;
    const ready = routes.filter(r => !r.busy && clock >= r.next);
    if (!ready.length) return;
    const r = ready[Math.floor(Math.random() * ready.length)];
    r.busy = true;
    particle(r, drawDur(r) * 1.05, {
      ease: ease.sine,
      onDone: () => { r.busy = false; r.next = clock + 2200 + Math.random() * 6000; },
    });
    // a light sheen runs along the line together with the shipment
    const sheen = el('path', { class: 'route-sheen', d: r.d }, lineLayer);
    const dur = drawDur(r) * 1.05, band = r.len * 0.35;
    tween(0, dur, p => {
      const s = ease.sine(p) * (r.len + band);
      sheen.style.strokeDasharray = `${band} ${r.len * 2}`;
      sheen.style.strokeDashoffset = band - s;
      sheen.style.opacity = 0.55 * Math.sin(p * Math.PI);
    }, () => sheen.remove());
  }

  /* ------------------------------------------------------------------
   * 6. Loop, pausing when the tab or hero is not visible.
   * ------------------------------------------------------------------ */
  let last = null, running = false, visible = true, raf = 0;
  function frame(now) {
    if (last === null) last = now;
    clock += Math.min(64, now - last);             // clamp big gaps (tab switches)
    last = now;
    for (const t of tweens) {
      if (clock < t.t0) continue;
      const p = Math.min(1, (clock - t.t0) / t.dur);
      t.update(p);
      if (p >= 1) { tweens.delete(t); t.done && t.done(); }
    }
    scheduleTraffic();
    raf = requestAnimationFrame(frame);
  }
  function play()  { if (running) return; running = true; last = null; raf = requestAnimationFrame(frame); }
  function pause() { running = false; cancelAnimationFrame(raf); }
  const sync = () => (visible && !document.hidden) ? play() : pause();
  document.addEventListener('visibilitychange', sync);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; sync(); }, { threshold: 0.05 })
      .observe(document.getElementById('hero'));
  }

  /* ------------------------------------------------------------------
   * 7. Responsive cover layout: image + overlay move as one.
   * ------------------------------------------------------------------ */
  const hero = document.getElementById('hero');
  const stage = document.getElementById('stage');
  function layout() {
    const cw = hero.clientWidth, ch = hero.clientHeight;
    const s = Math.max(cw / W, ch / H);
    const w = W * s, h = H * s;
    // focal point (fraction of the image) to keep centred when cropping:
    // wide screens keep the whole composition centred; portrait screens
    // centre on the Gulf network rather than the empty sea.
    const portrait = ch > cw * 1.1;
    const fx = portrait ? 0.53 : 0.5, fy = portrait ? 0.46 : 0.5;
    const x = Math.min(0, Math.max(cw - w, cw / 2 - fx * w));
    const y = Math.min(0, Math.max(ch - h, ch / 2 - fy * h));
    stage.style.width = `${w}px`;
    stage.style.height = `${h}px`;
    stage.style.transform = `translate(${x}px, ${y}px)`;
    // keep lines elegant: thin on huge screens, not hairline on phones
    svg.style.setProperty('--k', (1 / Math.sqrt(s)).toFixed(3));
  }
  layout();
  new ResizeObserver(layout).observe(hero);

  /* ------------------------------------------------------------------
   * 8. Start (or render the finished state for reduced motion).
   * ------------------------------------------------------------------ */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function showStatic() {
    for (const r of routes) {
      for (const p of [r.line, r.glow, r.glow2]) p.style.strokeDasharray = 'none';
    }
    Object.values(nodes).forEach(n => n.classList.add('on'));
  }

  /* ?debug shows the calibration: hollow = plain projection, dot = calibrated */
  if (/[?&]debug\b/.test(location.search)) {
    const dbg = document.getElementById('debugLayer');
    svg.style.mixBlendMode = 'normal';
    for (const [id, c] of Object.entries(CITIES)) {
      const b = proj.base(c.lat, c.lon);
      el('line', { x1: b[0], y1: b[1], x2: c.xy[0], y2: c.xy[1], stroke: '#0ff', 'stroke-width': 1 }, dbg);
      el('circle', { cx: b[0], cy: b[1], r: 5, fill: 'none', stroke: '#0ff', 'stroke-width': 1.5 }, dbg);
      el('circle', { cx: c.xy[0], cy: c.xy[1], r: 3, fill: '#f0f' }, dbg);
      const t = el('text', { x: c.xy[0] + 6, y: c.xy[1] - 6, fill: '#0ff', 'font-size': 12, 'font-family': 'monospace' }, dbg);
      t.textContent = id;
    }
    console.info('[routes] projection fit rms before RBF calibration:', proj.rms.toFixed(1), 'px');
  }

  const img = document.getElementById('heroImg');
  const go = () => {
    if (reduce) { showStatic(); return; }
    startIntro();
    sync();
  };
  (img.complete && img.naturalWidth) ? go() : img.addEventListener('load', go, { once: true });

  // expose for testing
  window.__routes = { CITIES, ROUTES, routes, proj, layout, pause, play };
})();
</script>
</body>
</html>
