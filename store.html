.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,20,16,0) 30%,rgba(26,20,16,.85))}
.hero .in{position:absolute;inset:auto 22px 22px;z-index:1;color:#fff}
.hero h1{margin:0;font-family:'El Messiri';font-weight:700;font-size:40px;line-height:1.2}
.hero p{margin:2px 0 10px;font-size:14px;opacity:.9}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badges span{padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);font-size:12px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:12px 16px;background:rgba(247,242,236,.92);backdrop-filter:blur(10px)}
nav a{padding:7px 18px;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--line);text-decoration:none;color:var(--ink);font-size:14px}
nav a.act{background:var(--ink);color:#fff}
section{padding:4px 16px}
h2{margin:14px 4px 10px;font-family:'El Messiri';font-weight:700;font-size:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr{position:relative;display:flex;flex-direction:column;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line);overflow:hidden;text-align:right;border:0;padding:0;cursor:pointer}
.pr img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pr .tg{position:absolute;top:10px;right:10px;padding:2px 9px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px}
.pr .b{padding:10px 12px 12px}
.pr .n{font-family:'El Messiri';font-weight:700;font-size:17px}
.pr .d{font-size:12px;color:var(--mut);line-height:1.5;min-height:2.9em}
.pr .p{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-family:'El Messiri';font-weight:700;color:var(--gold2)}
.pr .p i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:#fff;font-style:normal;font-size:20px}
.pr .q{position:absolute;top:10px;left:10px;min-width:26px;height:26px;padding:0 6px;border-radius:9px;background:var(--gold);color:#fff;font-size:13px;display:none;place-items:center}
.pr.has .q{display:grid}
.cart{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:8;transform:translate(-50%,140%);width:min(528px,calc(100% - 28px));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 12px 12px;border-radius:20px;border:0;background:var(--ink);color:#fff;box-shadow:0 16px 40px rgba(26,20,16,.45);transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.cart.on{transform:translate(-50%,0)}
.cart .c{display:flex;align-items:center;gap:10px;font-size:14px}
.cart .n{min-width:28px;height:28px;border-radius:9px;background:var(--gold);display:grid;place-items:center}
.cart .go{padding:8px 16px;border-radius:12px;background:#F7F2EC;color:var(--ink);font-weight:500;font-size:14px}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(26,20,16,.5);opacity:0;visibility:hidden;transition:.3s}
.sheet.on{opacity:1;visibility:visible}
.sh{width:min(560px,100%);max-height:90svh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:var(--bg);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.sheet.on .sh{transform:none}
.sh h3{margin:0 0 6px;font-family:'El Messiri';font-size:22px;display:flex;justify-content:space-between;align-items:center}
.sh h3 button{border:0;background:none;font-size:26px;width:40px;height:40px;cursor:pointer}
.pd img{width:100%;aspect-ratio:1.4;object-fit:cover;border-radius:18px;display:block}
.pd .d{color:var(--mut);font-size:14px;margin:8px 0 12px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.opts button{padding:9px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.opts button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qty{display:flex;align-items:center;gap:12px;background:#EDE3D7;border-radius:14px;padding:3px}
.qty button{width:40px;height:38px;border:0;border-radius:11px;background:var(--card);font-size:20px;cursor:pointer}
.big{width:100%;min-height:54px;margin-top:14px;border:0;border-radius:16px;background:var(--ink);color:#fff;font-weight:500;font-size:16px;cursor:pointer}
.big.wa{background:#1FAF5A}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.li small{display:block;color:var(--mut);font-size:12px}
.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.fld input,.fld select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.tot{margin:14px 0 0;font-size:14px;color:var(--mut)}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-family:'El Messiri';font-weight:700;font-size:20px;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:22px 16px}footer a{color:var(--gold2)}
.vx{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.15em;color:#B3A08E;text-decoration:none}
</style>

  const money = v => n(String(+v.toFixed(2)).replace('.', '٫')) + ' ' + S.currency;
  $('#nm').textContent = S.full; $('#tg').textContent = S.tagline; $('#ig').href = S.instagram;
  $('#area').innerHTML = S.delivery.map((d, i) => `<option value="${i}">${d[0]} · توصيل ${n(d[1])} ${S.currency}</option>`).join('');
  $('#nav').innerHTML = S.cats.map((c, i) => `<a href="#${c.id}" class="${i ? '' : 'act'}">${c.name}</a>`).join('');
  const all = [];
  $('#list').innerHTML = S.cats.map(c => `<section id="${c.id}"><h2>${c.name}</h2><div class="grid">${c.items.map(it => { const k = all.push(it) - 1; return `
    <button class="pr" type="button" data-k="${k}"><img src="${it.img}" alt="${it.n}" loading="lazy">${it.tag ? `<span class="tg">${it.tag}</span>` : ''}<span class="q"></span>
      <span class="b"><span class="n">${it.n}</span><span class="d" style="display:block">${it.d}</span><span class="p"><span>${money(it.p)}</span><i>+</i></span></span></button>`; }).join('')}</div></section>`).join('');
  const cart = []; let cur = null, size = 0, qty = 1;
  const price = () => all[cur].p + (all[cur].sizes ? all[cur].sizes[size][1] : 0);
  function openP(k) {
    cur = k; size = 0; qty = 1; const it = all[k];
    $('#pN').textContent = it.n; $('#pI').src = it.img; $('#pD').textContent = it.d;
    $('#pO').innerHTML = (it.sizes || []).map((s, i) => `<button type="button" data-s="${i}" aria-pressed="${i === 0}">${s[0]}${s[1] ? ` · +${n(s[1])}` : ''}</button>`).join('');
    upP(); $('#pSheet').classList.add('on');
  }
  function upP() { $('#qV').textContent = n(qty); $('#pP').textContent = money(price() * qty); }
  $('#pO').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; size = +b.dataset.s; $('#pO').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); upP(); });
  $('#qM').addEventListener('click', () => { qty = Math.max(1, qty - 1); upP(); });
  $('#qP').addEventListener('click', () => { qty = Math.min(20, qty + 1); upP(); });
  $('#addB').addEventListener('click', () => {
    const it = all[cur], sz = it.sizes ? it.sizes[size][0] : '';
    const ex = cart.find(c => c.k === cur && c.sz === sz); if (ex) ex.q += qty; else cart.push({ k: cur, sz, q: qty, p: price() });
    $('#pSheet').classList.remove('on'); render();
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) { }
  });
  function totals() { const sub = cart.reduce((a, c) => a + c.p * c.q, 0), del = cart.length ? S.delivery[+$('#area').value][1] : 0; return { sub, del, sum: sub + del, cnt: cart.reduce((a, c) => a + c.q, 0) }; }
  function render() {
    const t = totals();
    $('#cn').textContent = n(t.cnt); $('#ct').textContent = money(t.sub); $('#cart').classList.toggle('on', t.cnt > 0);
    document.querySelectorAll('.pr').forEach(p => { const q = cart.filter(c => c.k === +p.dataset.k).reduce((a, c) => a + c.q, 0); p.classList.toggle('has', q > 0); p.querySelector('.q').textContent = n(q); });
    $('#lines').innerHTML = cart.map((c, i) => `<div class="li"><span>${all[c.k].n}<small>${c.sz ? c.sz + ' · ' : ''}${money(c.p)} × ${n(c.q)}</small></span><b>${money(c.p * c.q)}</b></div>`).join('');
    $('#sub').textContent = money(t.sub); $('#del').textContent = money(t.del); $('#sum').textContent = money(t.sum);
  }
  $('#area').addEventListener('change', render);
  $('#list').addEventListener('click', e => { const p = e.target.closest('.pr'); if (p) openP(+p.dataset.k); });
  $('#cart').addEventListener('click', () => $('#cSheet').classList.add('on'));
  document.querySelectorAll('.sheet').forEach(sh => sh.addEventListener('click', e => { if (e.target === sh || e.target.closest('[data-close]')) sh.classList.remove('on'); }));
  $('#send').addEventListener('click', () => {
    const who = $('#who').value.trim(); if (!who) { $('#who').focus(); $('#who').placeholder = 'اكتب اسمك لو سمحت'; return; }
    const t = totals(), a = S.delivery[+$('#area').value];
    const msg = [`🛍️ طلب جديد · ${S.full}`, ...cart.map(c => `• ${all[c.k].n}${c.sz ? ' (' + c.sz + ')' : ''} × ${c.q} = ${c.p * c.q} ${S.currency}`), `التوصيل (${a[0]}): ${a[1]} ${S.currency}`, `المجموع: ${t.sum} ${S.currency} · الدفع عند الاستلام`, `الاسم: ${who}`].concat($('#addr').value.trim() ? [`العنوان: ${$('#addr').value.trim()}`] : []).join('\n');
    window.open(`https://wa.me/${S.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
  });
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) document.querySelectorAll('nav a').forEach(a => a.classList.toggle('act', a.hash === '#' + e.target.id)); }), { rootMargin: '-45% 0px -50% 0px' });
  document.querySelectorAll('main section').forEach(s => io.observe(s));
})();
</script>
</body>
</html>
