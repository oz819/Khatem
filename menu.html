.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,29,20,.1),rgba(43,29,20,.82))}
.hero .in{position:absolute;inset:auto 20px 20px;z-index:1;color:#fff}
.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#F6EFE6;color:var(--ink);font-family:'El Messiri';font-weight:700;font-size:28px;margin-bottom:10px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.hero h1{margin:0;font-family:'El Messiri';font-weight:700;font-size:32px;line-height:1.3}
.hero p{margin:2px 0 8px;font-size:14px;opacity:.9}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);font-size:12px}
.pill.on{background:#2E9E5B}.pill.off{background:#A33}
.tbl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 16px 0;padding:12px 16px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.tbl b{font-family:'El Messiri';font-size:18px}
.tbl span{font-size:13px;color:var(--mut)}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:rgba(246,239,230,.92);backdrop-filter:blur(10px);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:7px 16px;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--line);text-decoration:none;color:var(--ink);font-size:14px}
nav a.act{background:var(--ink);color:#F6EFE6}
section{padding:6px 16px 4px}
h2{margin:14px 4px 10px;font-family:'El Messiri';font-weight:700;font-size:22px}
.it{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:10px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line);margin-bottom:10px}
.it.noimg{grid-template-columns:56px 1fr}
.ph{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;background:#EADCCB}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.noimg .ph{width:56px;height:56px;display:grid;place-items:center;font-family:'El Messiri';font-weight:700;color:var(--car2);font-size:22px}
.tg{position:absolute;top:6px;right:6px;padding:1px 7px;border-radius:999px;background:var(--car);color:#fff;font-size:10px}
.nm{font-weight:500;font-size:16px;line-height:1.5}
.ds{font-size:13px;color:var(--mut);line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.pr{font-family:'El Messiri';font-weight:700;font-size:17px;color:var(--car2)}
.pr small{font-size:12px;font-weight:500;color:var(--mut)}
.add{min-width:40px;height:36px;padding:0 12px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.qty{display:flex;align-items:center;gap:10px;background:#EFE3D4;border-radius:12px;padding:2px}
.qty button{width:34px;height:32px;border:0;border-radius:10px;background:var(--card);font-size:18px;cursor:pointer}
.qty b{min-width:16px;text-align:center}
.cart{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:8;transform:translate(-50%,140%);width:min(528px,calc(100% - 28px));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 12px 12px;border-radius:20px;border:0;background:var(--ink);color:#fff;box-shadow:0 16px 40px rgba(43,29,20,.45);transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.cart.on{transform:translate(-50%,0)}
.cart .c{display:flex;align-items:center;gap:10px;font-size:14px}
.cart .n{min-width:28px;height:28px;border-radius:9px;background:var(--car);display:grid;place-items:center;font-weight:500}
.cart .go{padding:8px 16px;border-radius:12px;background:#F6EFE6;color:var(--ink);font-weight:500;font-size:14px}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,29,20,.45);opacity:0;visibility:hidden;transition:.3s}
.sheet.on{opacity:1;visibility:visible}
.sh{width:min(560px,100%);max-height:86svh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:var(--bg);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.sheet.on .sh{transform:none}
.sh h3{margin:0 0 10px;font-family:'El Messiri';font-size:22px;display:flex;justify-content:space-between;align-items:center}
.sh h3 button{border:0;background:none;font-size:24px;cursor:pointer;width:40px;height:40px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li .t{font-size:15px}.li .t small{display:block;color:var(--mut);font-size:12px}
.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.fld input,.fld textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:16px}
.fld textarea{min-height:64px;resize:vertical}
.tot{display:flex;justify-content:space-between;margin:14px 0;font-family:'El Messiri';font-weight:700;font-size:20px}
.send{width:100%;min-height:52px;border:0;border-radius:16px;background:#1FAF5A;color:#fff;font-weight:500;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--car);outline-offset:2px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px 16px}
footer a{color:var(--car2)}
.vx{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.15em;color:#B3A08E;text-decoration:none}
</style>
</head>
<body>
<div class="demo">نموذج منيو QR من VELTRIX · <a href="index.html">اطلب منيو لمحلك</a></div>
<div class="wrap">
  <header class="hero"><div class="in">
    <div class="logo">ن</div>
    <h1 id="nm"></h1><p id="tg"></p>
    <div class="pills"><span class="pill" id="st"></span><span class="pill" id="ar"></span></div>
  </div></header>
  <div class="tbl" id="tbl" hidden><span>طلبك رح يوصل على</span><b id="tno"></b></div>
  <nav id="nav" aria-label="الأقسام"></nav>
  <main id="list"></main>
  <footer>أهلاً فيكم دايماً 🤎<br><a id="ig" target="_blank" rel="noopener">إنستغرام</a><br><a class="vx" href="index.html">VELTRIX صُمّم بواسطة</a></footer>
</div>
<button class="cart" id="cart" type="button" aria-label="عرض الطلب"><span class="c"><span class="n" id="cn">٠</span><span id="ct"></span></span><span class="go">اطلب الآن</span></button>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="طلبك"><div class="sh">
  <h3>طلبك <button type="button" id="close" aria-label="إغلاق">×</button></h3>
  <div id="lines"></div>
  <label class="fld"><span>رقم الطاولة أو اسمك</span><input id="who" placeholder="مثلاً: طاولة ٥"></label>
  <label class="fld"><span>ملاحظات</span><textarea id="note" placeholder="مثلاً: سكر خفيف، حليب شوفان…"></textarea></label>
  <div class="tot"><span>المجموع</span><span id="sum"></span></div>
  <button class="send" type="button" id="send">إرسال الطلب على واتساب</button>
</div></div>
<script>
(function () {
  const M = window.MENU, $ = s => document.querySelector(s), AR = '٠١٢٣٤٥٦٧٨٩';
  const n = v => String(v).replace(/[0-9]/g, d => AR[d]);
  const money = v => n(v.toFixed(2).replace(/\.?0+$/, '').replace('.', '٫')) + ' ' + M.currency;
  const cart = {};
  const P = new URLSearchParams(location.search), table = P.get('t');
  $('#nm').textContent = M.name; $('#tg').textContent = M.tagline; $('#ar').textContent = M.area; $('#ig').href = M.instagram;
  const h = new Date().getHours(), open = h >= M.open && h < M.close;
  $('#st').textContent = open ? `مفتوح الآن · لحد ${n(M.close > 12 ? M.close - 12 : M.close)} بالليل` : `مسكّر · بنفتح ${n(M.open)} الصبح`; $('#st').classList.add(open ? 'on' : 'off');
  if (table) { $('#tbl').hidden = false; $('#tno').textContent = 'طاولة ' + n(table); $('#who').value = 'طاولة ' + n(table); }
  $('#nav').innerHTML = M.cats.map((c, i) => `<a href="#${c.id}" class="${i ? '' : 'act'}">${c.name}</a>`).join('');
  const all = [];
  $('#list').innerHTML = M.cats.map(c => `<section id="${c.id}"><h2>${c.name}</h2>${c.items.map(it => { const k = all.push(it) - 1; return `
    <div class="it ${it.img ? '' : 'noimg'}"><div class="ph">${it.img ? `<img src="${it.img}" alt="${it.n}" loading="lazy">` : it.n[0]}${it.tag ? `<span class="tg">${it.tag}</span>` : ''}</div>
    <div><div class="nm">${it.n}</div><div class="ds">${it.d}</div><div class="row"><span class="pr">${money(it.p)}</span><span data-k="${k}"></span></div></div></div>`; }).join('')}</section>`).join('');
  function ctrl(k) {
    const q = cart[k] || 0, box = document.querySelector(`[data-k="${k}"]`);
    box.innerHTML = q ? `<span class="qty"><button type="button" data-d="-1" aria-label="أقل">−</button><b>${n(q)}</b><button type="button" data-d="1" aria-label="أكثر">+</button></span>` : `<button class="add" type="button" data-d="1" aria-label="أضف ${all[k].n}">+</button>`;
  }
  all.forEach((_, k) => ctrl(k));
  function totals() {
    const ks = Object.keys(cart).filter(k => cart[k] > 0);
    const cnt = ks.reduce((a, k) => a + cart[k], 0), sum = ks.reduce((a, k) => a + cart[k] * all[k].p, 0);
    $('#cn').textContent = n(cnt); $('#ct').textContent = money(sum); $('#cart').classList.toggle('on', cnt > 0);
    $('#lines').innerHTML = ks.map(k => `<div class="li"><span class="t">${all[k].n}<small>${money(all[k].p)} × ${n(cart[k])}</small></span><b>${money(all[k].p * cart[k])}</b></div>`).join('');
    $('#sum').textContent = money(sum);
    if (!cnt) $('#sheet').classList.remove('on');
    return { ks, sum };
  }
  $('#list').addEventListener('click', e => {
    const b = e.target.closest('[data-d]'); if (!b) return;
    const k = b.closest('[data-k]').dataset.k; cart[k] = Math.max(0, (cart[k] || 0) + +b.dataset.d); ctrl(k); totals();
    if (navigator.vibrate) try { navigator.vibrate(8); } catch (er) { }
  });
  $('#cart').addEventListener('click', () => $('#sheet').classList.add('on'));
  $('#close').addEventListener('click', () => $('#sheet').classList.remove('on'));
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('on'); });
  $('#send').addEventListener('click', () => {
    const { ks, sum } = totals(); if (!ks.length) return;
    const lines = [`🧾 طلب جديد · ${M.name}`, ...ks.map(k => `• ${all[k].n} × ${cart[k]}`), `المجموع: ${sum.toFixed(2)} ${M.currency}`];
    const who = $('#who').value.trim(), note = $('#note').value.trim();
    if (who) lines.push(`الطاولة/الاسم: ${who}`); if (note) lines.push(`ملاحظات: ${note}`);
    window.open(`https://wa.me/${M.whatsapp}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
  });
  // active category on scroll
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) document.querySelectorAll('nav a').forEach(a => { const on = a.hash === '#' + e.target.id; a.classList.toggle('act', on); if (on) a.scrollIntoView({ inline: 'center', block: 'nearest' }); }); }), { rootMargin: '-45% 0px -50% 0px' });
  document.querySelectorAll('main section').forEach(s => io.observe(s));
})();
</script>
</body>
</html>
